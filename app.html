<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wargame Studio Demó</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Koncepció: parancsnoki munkaasztal. Átlátszó üvegpanelek egy procedurálisan generált, lassan sodródó légi felvétel-szerű terep felett. A folyamat 18 lépése a gerinc, minden nézet a handbook szerinti lépéshez van kötve. */
:root{
  --bg:#E8EEEC;--glass:rgba(247,250,249,.8);--glass2:rgba(255,255,255,.92);
  --ink:#0F1B21;--mut:#41545C;--ln:rgba(15,27,33,.18);--ln2:rgba(15,27,33,.08);
  --ac:#1B5C78;--ac-t:rgba(27,92,120,.12);--ok:#1E7A3C;--now:#8F5500;--bad:#B3262D;
  --hu:#0A7A70;--ai:#5B3FD0;--on-rc:#fff;
  --pf:saturate(.85) brightness(1.12);--veil-a:rgba(232,238,236,.55);--veil-b:rgba(232,238,236,.78);--veil-edge:rgba(232,238,236,.9);
  --c-MEG:#8A5800;--c-IGA:#A1232B;--c-TER:#6A3CA3;--c-FEJ:#2B4DB8;--c-ELE:#0A6B70;--c-FOR:#A12F6C;--c-OPF:#4B5566;--c-REN:#AD460A;--c-JAT:#23743A;--c-ADJ:#6A4A2A;--c-FAC:#5C6900;
  --f-sans:'IBM Plex Sans',system-ui,sans-serif;--f-cond:'IBM Plex Sans Condensed','IBM Plex Sans',sans-serif;--f-mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#091014;--glass:rgba(12,20,26,.78);--glass2:rgba(20,31,39,.88);
  --ink:#E7EFF3;--mut:#9DB1BB;--ln:rgba(160,190,205,.22);--ln2:rgba(160,190,205,.1);
  --ac:#72BAD8;--ac-t:rgba(114,186,216,.14);--ok:#5CC274;--now:#F0B84A;--bad:#FF8085;
  --hu:#3DD6C6;--ai:#B8A0FF;--on-rc:#091014;
  --pf:saturate(.75) brightness(.5) contrast(1.1);--veil-a:rgba(9,16,20,.45);--veil-b:rgba(9,16,20,.7);--veil-edge:rgba(9,16,20,.9);
  --c-MEG:#E0A93B;--c-IGA:#F0646C;--c-TER:#A97BE0;--c-FEJ:#6C8CF0;--c-ELE:#2FC2C8;--c-FOR:#E066A8;--c-OPF:#8C97A8;--c-REN:#F08A45;--c-JAT:#5CC274;--c-ADJ:#B58A5C;--c-FAC:#B5C73A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#091014;--glass:rgba(12,20,26,.78);--glass2:rgba(20,31,39,.88);
  --ink:#E7EFF3;--mut:#9DB1BB;--ln:rgba(160,190,205,.22);--ln2:rgba(160,190,205,.1);
  --ac:#72BAD8;--ac-t:rgba(114,186,216,.14);--ok:#5CC274;--now:#F0B84A;--bad:#FF8085;
  --hu:#3DD6C6;--ai:#B8A0FF;--on-rc:#091014;
  --pf:saturate(.75) brightness(.5) contrast(1.1);--veil-a:rgba(9,16,20,.45);--veil-b:rgba(9,16,20,.7);--veil-edge:rgba(9,16,20,.9);
  --c-MEG:#E0A93B;--c-IGA:#F0646C;--c-TER:#A97BE0;--c-FEJ:#6C8CF0;--c-ELE:#2FC2C8;--c-FOR:#E066A8;--c-OPF:#8C97A8;--c-REN:#F08A45;--c-JAT:#5CC274;--c-ADJ:#B58A5C;--c-FAC:#B5C73A;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.photo{position:fixed;inset:-6%;width:112%;height:112%;z-index:-3;filter:var(--pf);animation:drift 140s ease-in-out infinite alternate;will-change:transform;object-fit:cover}
@keyframes drift{from{transform:translate3d(-1.2%,-.8%,0) scale(1.03)}to{transform:translate3d(1.2%,.8%,0) scale(1.09)}}
.veil{position:fixed;inset:0;z-index:-2;background:radial-gradient(ellipse at 50% 35%,transparent 0,var(--veil-edge) 120%),linear-gradient(var(--veil-a),var(--veil-b));pointer-events:none}
.grain{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.07;mix-blend-mode:overlay;background-image:var(--grain)}
@media (prefers-reduced-motion:reduce){.photo{animation:none}.pulse{animation:none!important}}
.app{max-width:1500px;margin:0 auto;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.panel{background:var(--glass);border:1px solid var(--ln);border-radius:10px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);min-width:0}
.hud{position:relative}
.hud::before,.hud::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--ac);opacity:.7;pointer-events:none}
.hud::before{left:-1px;top:-1px;border-right:0;border-bottom:0;border-radius:10px 0 0 0}
.hud::after{right:-1px;bottom:-1px;border-left:0;border-top:0;border-radius:0 0 10px 0}
.mono{font-family:var(--f-mono)}
.lbl{font:600 11px/1.2 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
h1,h2,h3{margin:0;font-family:var(--f-cond);text-transform:uppercase;letter-spacing:.03em}
.top{display:flex;align-items:center;gap:12px;padding:10px 14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font:700 15px/1 var(--f-cond);letter-spacing:.16em;text-transform:uppercase}
.brand small{display:block;font:500 11px/1.2 var(--f-mono);color:var(--mut);letter-spacing:.04em}
.vsep{width:1px;height:28px;background:var(--ln)}
.sp{flex:1}
.ctl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
select,.btn,input[type=text],input[type=number],textarea{background:var(--glass2);border:1px solid var(--ln);border-radius:8px;min-height:36px;padding:0 10px}
textarea{padding:8px 10px;width:100%;resize:vertical;line-height:1.45}
input[type=text],input[type=number]{width:100%}
.btn{font-weight:600;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ac)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--on-rc)}
.btn.pri:disabled{background:var(--glass2);color:var(--mut);border-color:var(--ln);cursor:not-allowed}
.btn.sm{min-height:30px;padding:0 9px;font-size:12px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{min-height:48px;padding:6px 16px;border-radius:10px;border:1px solid var(--ln);background:var(--glass);backdrop-filter:blur(10px);text-align:left;font-weight:600}
.tab small{display:block;font:500 11px/1.2 var(--f-mono);color:var(--mut)}
.tab[aria-selected=true]{border-color:var(--ac);box-shadow:inset 0 -3px 0 var(--ac)}
.rail{padding:10px 14px;overflow-x:auto}
.rg{display:grid;grid-template-columns:92px repeat(18,minmax(34px,1fr));gap:4px 4px;min-width:820px;align-items:center}
.rg .ph{font:700 11px/1 var(--f-cond);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);border-bottom:2px solid var(--ln);padding-bottom:3px}
.rg .rl{font:600 10.5px/1.1 var(--f-mono);color:var(--mut);letter-spacing:.04em}
.sb{height:34px;border-radius:50%;border:2px solid var(--ln);background:var(--glass2);font:600 12px var(--f-mono);display:flex;align-items:center;justify-content:center;padding:0;width:34px;justify-self:center}
.sb.done{background:var(--ok);border-color:var(--ok);color:var(--on-rc)}
.sb.cur{border-color:var(--now);color:var(--now);box-shadow:0 0 0 4px color-mix(in srgb,var(--now) 22%,transparent)}
.sb.view{outline:2px solid var(--ac);outline-offset:2px}
.sb.fut{color:var(--mut)}
.dia{width:12px;height:12px;background:var(--c-MEG);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);justify-self:center}
.dia.cond{opacity:.5}
.lane{height:6px;border-radius:3px;background:var(--ln2)}
.lane.on.dc{background:var(--c-ELE)}.lane.on.ev{background:var(--c-REN)}
.lane.has{background:color-mix(in srgb,var(--ln) 70%,transparent)}
.flow{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:12px;align-items:start}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.pad{padding:14px 16px}
.shead{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.bign{font:600 56px/.9 var(--f-mono);color:var(--now)}
.shead h2{font-size:28px;line-height:1.05}
.chipx{font:600 11px/1 var(--f-mono);padding:4px 7px;border-radius:5px;border:1px solid var(--ln);color:var(--mut);letter-spacing:.04em;text-transform:uppercase}
.chipx.tp{color:var(--c-MEG);border-color:var(--c-MEG);display:inline-flex;gap:6px;align-items:center}
.chipx.tp.cond{border-style:dashed}
.chipx.hu{color:var(--hu);border-color:var(--hu)}.chipx.ai{color:var(--ai);border-color:var(--ai)}
.inp{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--mut)}
.task{display:flex;align-items:stretch;border-radius:8px;overflow:hidden;background:color-mix(in srgb,var(--rc) 14%,var(--glass2));border:1px solid color-mix(in srgb,var(--rc) 30%,transparent);cursor:pointer;min-height:44px}
.task .code{flex:0 0 52px;background:var(--rc);color:var(--on-rc);font:700 12px var(--f-mono);display:flex;align-items:center;justify-content:center}
.task .tx{flex:1;padding:8px 10px;display:flex;align-items:center}
.task .ck{flex:0 0 44px;display:flex;align-items:center;justify-content:center}
.task input{width:20px;height:20px;accent-color:var(--rc)}
.task.dim{opacity:.62}
.task.mine{box-shadow:0 0 0 2px var(--rc)}
.r-MEG{--rc:var(--c-MEG)}.r-IGA{--rc:var(--c-IGA)}.r-TER{--rc:var(--c-TER)}.r-FEJ{--rc:var(--c-FEJ)}.r-ELE{--rc:var(--c-ELE)}.r-FOR{--rc:var(--c-FOR)}.r-OPF{--rc:var(--c-OPF)}.r-REN{--rc:var(--c-REN)}.r-JAT{--rc:var(--c-JAT)}.r-ADJ{--rc:var(--c-ADJ)}.r-FAC{--rc:var(--c-FAC)}
.tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.thr{display:flex;align-items:center;gap:10px;border-radius:18px;padding:5px 14px;font-weight:600;font-size:13px;color:var(--on-rc);min-height:32px}
.thr.dc{background:var(--c-ELE)}.thr.ev{background:var(--c-REN)}
.prod{border:2px dashed var(--ink);border-radius:10px;padding:12px 14px;background:var(--glass2)}
.prod .lbl{color:var(--ink)}
.fld{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.fld>span{font-size:12px;font-weight:600;color:var(--mut)}
.ckl{display:flex;gap:10px;align-items:center;min-height:36px;margin-top:6px}
.ckl input{width:20px;height:20px;accent-color:var(--ac)}
.gi{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--ln2);font-size:13px}
.gi:first-child{border-top:0}
.mk{flex:0 0 20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 12px var(--f-mono);border:2px solid var(--ln);color:var(--mut)}
.gi.ok .mk{background:var(--ok);border-color:var(--ok);color:var(--on-rc)}
.gi.soft .mk{border-style:dashed}
.roster{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;align-items:start}
.team{padding:10px;display:flex;flex-direction:column;gap:5px}
.thd{display:flex;align-items:center;gap:10px;padding:2px 4px 6px}
.thd h3{font-size:16px;flex:1}
.seat{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;border:1px solid var(--ln);border-radius:8px;background:var(--glass2);padding:0 10px;text-align:left;border-left:5px solid var(--rc,var(--ln))}
.seat.off{opacity:.5;border-left-color:var(--ln)}
.seat.st-ok{background:color-mix(in srgb,var(--ok) 20%,var(--glass2));border-color:color-mix(in srgb,var(--ok) 55%,var(--ln))}
.seat.st-bad{background:color-mix(in srgb,var(--bad) 17%,var(--glass2));border-color:color-mix(in srgb,var(--bad) 50%,var(--ln))}
.tg.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,transparent)}
.lg{display:inline-flex;align-items:center;gap:6px;margin-right:14px;font-size:12px;color:var(--mut)}.lg i{width:14px;height:14px;border-radius:4px;display:inline-block}
.lg .g{background:color-mix(in srgb,var(--ok) 45%,transparent);border:1px solid var(--ok)}.lg .r{background:color-mix(in srgb,var(--bad) 40%,transparent);border:1px solid var(--bad)}
.seat[aria-expanded=true]{border-color:var(--ac)}
.seat .nm{flex:1;min-width:0;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat .nm small{display:block;font:500 11px var(--f-mono);color:var(--mut)}
.tg{font:700 10px var(--f-mono);padding:2px 6px;border-radius:4px}
.tg.hu{color:var(--hu);background:color-mix(in srgb,var(--hu) 16%,transparent)}.tg.ai{color:var(--ai);background:color-mix(in srgb,var(--ai) 16%,transparent)}.tg.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,transparent)}.tg.wt{color:var(--now);background:color-mix(in srgb,var(--now) 16%,transparent)}.tg.off{color:var(--mut);background:var(--ln2)}
.sdet{border:1px solid var(--ac);border-radius:8px;background:var(--glass2);padding:10px;display:flex;flex-direction:column;gap:10px}
.seg{display:flex;border:1px solid var(--ln);border-radius:8px;overflow:hidden}
.seg button{flex:1;min-height:40px;border:0;background:transparent;font-weight:600;color:var(--mut)}
.seg button.on.hu{background:color-mix(in srgb,var(--hu) 18%,transparent);color:var(--hu)}.seg button.on.ai{background:color-mix(in srgb,var(--ai) 18%,transparent);color:var(--ai)}
.acc{border-top:1px solid var(--ln2)}
.acc>summary{min-height:40px;display:flex;align-items:center;cursor:pointer;font-weight:600;font-size:13px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:3px 0;color:var(--mut)}.kv b{color:var(--ink);font-weight:500;text-align:right}
.qr{background:#fff;padding:8px;border-radius:8px;width:144px;height:144px;flex:none}
.qr img,.qr canvas{width:100%!important;height:100%!important;display:block}
.board{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:12px;align-items:start}
.mapw{position:relative;aspect-ratio:3/2;border-radius:8px;border:1px solid var(--ln);background:#222}
.mclip{position:absolute;inset:0;overflow:hidden;border-radius:7px}
.mapw canvas{position:absolute;inset:0;width:100%;height:100%;filter:saturate(.95)}
.mgrid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}
.mgrid div{border:1px solid rgba(255,255,255,.55);box-shadow:inset 0 0 0 1px rgba(0,0,0,.28);position:relative}
.mgrid span{position:absolute;left:6px;top:4px;font:600 11px var(--f-mono);color:#fff;text-shadow:0 1px 2px #000}
.mgrid .hot{background:rgba(255,190,60,.22);border-color:rgba(255,190,60,.9)}
.mk2{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;transition:left .8s,top .8s}
.mk2 i{font:600 10px var(--f-mono);font-style:normal;background:rgba(0,0,0,.65);color:#fff;padding:1px 4px;border-radius:3px}
.mk2{cursor:pointer;background:none;border:0;padding:4px;font:inherit;border-radius:8px;z-index:2}
.mk2:hover,.mk2:focus-visible,.mk2.pin{outline:2px solid var(--ac);background:rgba(0,0,0,.25)}
.tip{display:none;position:absolute;z-index:30;width:min(372px,calc(100% - 16px));background:var(--bg2,var(--glass2));color:var(--ink);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;box-shadow:0 12px 32px rgba(0,0,0,.45);pointer-events:none;font-size:12px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.mk2:hover+.tip,.mk2:focus-visible+.tip,.mk2.pin+.tip{display:block}
.tip.c0{left:8px}.tip.c1{left:50%;transform:translateX(-50%)}.tip.c2{right:8px}.tip.r0{bottom:8px}.tip.r1,.tip.r2{top:8px}
.tip h4{margin:0 0 6px;display:flex;gap:8px;align-items:center;font-size:13px}
.tip h4 em{margin-left:auto;font:600 11px var(--f-mono);font-style:normal;color:var(--mut)}
.tip .sub{font:600 10px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:8px 0 3px}
.dm{width:100%;border-collapse:collapse;font-size:11px}
.dm th{font:600 9.5px var(--f-mono);color:var(--mut);padding:2px 1px;text-align:center}
.dm td{padding:2px 1px;text-align:center;border-top:1px solid var(--ln2)}
.dm td:first-child,.dm th:first-child{text-align:left;padding-right:4px;white-space:nowrap;max-width:96px;overflow:hidden;text-overflow:ellipsis}
.dm .on{color:var(--tc);font-weight:700}.dm tfoot td{font-weight:700;color:var(--mut)}
.tip .res{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tip .why{color:var(--mut);margin-top:3px}
.tip svg.ch{width:100%;height:auto;display:block}
.tip .twoc{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:end}
.sh{display:grid;grid-template-columns:repeat(3,22px);grid-template-rows:repeat(3,22px);gap:2px}
.sh b{display:grid;place-items:center;font:600 10px var(--f-mono);border-radius:3px;background:color-mix(in srgb,var(--tc) calc(var(--k)*22%),transparent);border:1px solid var(--ln);color:var(--ink)}
.sh b.here{outline:2px solid var(--tc);outline-offset:1px}
@media(max-width:760px){.tip{left:0!important;right:0!important;top:calc(100% + 6px)!important;bottom:auto!important;transform:none!important;width:auto}}
.pulse{animation:pl 2.4s ease-in-out infinite}
@keyframes pl{50%{opacity:.45}}
.pipe{display:flex;gap:4px;flex-wrap:wrap}
.pipe span{flex:1;min-width:88px;text-align:center;font:600 11px var(--f-mono);padding:7px 4px;border-radius:6px;border:1px solid var(--ln);color:var(--mut);letter-spacing:.04em}
.pipe span.on{border-color:var(--now);color:var(--now);background:color-mix(in srgb,var(--now) 12%,transparent)}
.pipe span.dn{background:var(--ok);border-color:var(--ok);color:var(--on-rc)}
.ord{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;padding:8px;border:1px solid var(--ln);border-radius:8px;background:var(--glass2)}
.ord .r1{display:flex;align-items:center;gap:8px}
.ord .r2{display:grid;grid-template-columns:1fr 84px;gap:6px}
.sc{display:flex;height:14px;border-radius:3px;overflow:hidden;background:var(--ln2)}
.sc i{display:block}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-top:1px solid var(--ln2);vertical-align:top}
th{font:600 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.scr{overflow-x:auto}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start}
.note{font-size:13px;color:var(--mut);padding:8px 12px;border-left:3px solid var(--now);background:color-mix(in srgb,var(--now) 9%,transparent);border-radius:0 6px 6px 0}
.tri{display:inline-flex;border:1px solid var(--ln);border-radius:6px;overflow:hidden}
.tri button{border:0;background:transparent;min-height:32px;padding:0 8px;font:600 11px var(--f-mono);color:var(--mut)}
.tri button.on{background:var(--ac-t);color:var(--ac)}.tri button.on.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}.tri button.on.okk{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.scrim{position:fixed;inset:0;z-index:50;background:rgba(5,10,14,.7);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}

function hash(x,y,s){let h=(x*374761393+y*668265263+s*2147483647)|0;h=(h^(h>>>13))*1274126177|0;return((h^(h>>>16))>>>0)/4294967295}
function vnoise(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);const a=hash(xi,yi,s),b=hash(xi+1,yi,s),c=hash(xi,yi+1,s),d=hash(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,y,s,o=5){let a=.5,f=1,t=0,n=0;for(let i=0;i<o;i++){t+=a*vnoise(x*f,y*f,s+i*17);n+=a;a*=.5;f*=2}return t/n}

function genTerrain(kind){
  const W=640,H=400,cv=$('#terrain');cv.width=W;cv.height=H;const g=cv.getContext('2d');const P=TERR[kind]||TERR.temp;
  const img=g.createImageData(W,H),e=new Float32Array(W*H);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)e[y*W+x]=fbm(x/120,y/120,3,6);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const k=y*W+x,el=e[k],m=fbm(x/80+40,y/80+40,9,5),hi=fbm(x/6,y/6,21,2);
    const sx=e[y*W+Math.min(W-1,x+1)]-e[y*W+Math.max(0,x-1)],sy=e[Math.min(H-1,y+1)*W+x]-e[Math.max(0,y-1)*W+x];
    let sh=1+(-sx-sy)*5.2;sh=Math.max(.55,Math.min(1.45,sh));
    let c;
    if(el<.4){const d=Math.min(1,(.4-el)*7);c=P.water.map((v,i)=>v+(P.deep[i]-v)*d);sh=1+(sh-1)*.3}
    else if(el>P.hi){c=P.rock;const f=.85+hi*.3;c=c.map(v=>v*f)}
    else if(m>.52){const fc=P.forest[hi>.5?1:0];const f=.8+hi*.45;c=fc.map(v=>v*f)}
    else{const pid=Math.floor(hash(Math.floor(x/22),Math.floor(y/16),5)*P.field.length);const fc=P.field[pid];const edge=(x%22===0||y%16===0)?.82:1;const f=(.92+hi*.16)*edge;c=fc.map(v=>v*f)}
    const o=k*4;img.data[o]=Math.max(0,Math.min(255,c[0]*sh));img.data[o+1]=Math.max(0,Math.min(255,c[1]*sh));img.data[o+2]=Math.max(0,Math.min(255,c[2]*sh));img.data[o+3]=255;
  }
  g.putImageData(img,0,0);
  g.lineCap='round';g.strokeStyle='rgba(222,214,196,.6)';g.lineWidth=1.2;
  [[0,300,160,270,300,310,460,250,640,230],[210,0,230,120,300,200,280,300,330,400],[0,90,120,120,260,70,420,110,640,80]].forEach(p=>{g.beginPath();g.moveTo(p[0],p[1]);g.bezierCurveTo(p[2],p[3],p[4],p[5],p[6],p[7]);if(p.length>8)g.bezierCurveTo(p[6]+60,p[7]-30,p[8]-80,p[9]+20,p[8],p[9]);g.stroke()});
  for(let i=0;i<9;i++){const x=40+hash(i,1,7)*560,y=30+hash(i,2,7)*340;for(let j=0;j<14;j++){g.fillStyle=hash(i,j,8)>.5?'rgba(200,196,188,.85)':'rgba(150,92,76,.8)';g.fillRect(x+(hash(i,j,3)-.5)*18,y+(hash(i,j,4)-.5)*12,3,2)}}
  TC=cv;
  try{const gc=document.createElement('canvas');gc.width=gc.height=128;const gg=gc.getContext('2d');const id=gg.createImageData(128,128);for(let i=0;i<id.data.length;i+=4){const v=Math.random()*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255}gg.putImageData(id,0,0);document.documentElement.style.setProperty('--grain',`url(${gc.toDataURL()})`)}catch(e){}
}

function autoTurn(r,upTo){
  let tn=curTurn(r);if(!tn||tn.phase===3)tn=newTurn(r);
  if(tn.phase===0){tn.inject=tn.inject||(r.mode==='execution'&&tn.i===0?INJ0:INJ[(tn.i-1+INJ.length)%INJ.length]);tn.phase=1;tn.t0=Date.now()-(90+Math.floor(hash(tn.i,2,2)*200))*1000}
  if(tn.phase===1)decSeats().forEach(s=>{if(!tn.orders[s.id])tn.orders[s.id]=genOrder(s,tn)});
  if(upTo==='orders')return tn;
  tn.phase=2;
  activeTeams(tn).forEach(t=>{if(!tn.adj[t]){const roll=1+Math.floor(hash(t.charCodeAt(0),tn.i,9)*6);tn.adj[t]=PACK==='pso'?psoAdj(t,tn.i):{res:roll>=5?'Siker':roll>=3?'Részleges':'Kudarc',why:'Az indoklások és a helyzet alapján, '+cfg().adj.toLowerCase()+' módszerrel.',method:cfg().adj,roll}}});

}

  if(upTo>=16)cfg().obj.forEach((o,i)=>{S.odcr[i]={d:'A csapatok indoklásai alapján a koordináció a szűk keresztmetszet.',c:'A célkitűzés részben teljesült; a döntési késleltetés érdemben hatott a tempóra.',r:'A követő elemzésben a szövetséges koordinációt külön kell vizsgálni.'}});
  for(let n=1;n<upTo;n++)S.done[n]=true;
  for(let n=upTo;n<=18;n++)S.done[n]=false;

}

  h+=a?`<div class="res"><span class="tg ${a.res==='Siker'?'ok':a.res==='Részleges'?'wt':'off'}">${esc(a.res)}</span><span class="mono" style="color:var(--mut)">${a.method?esc(a.method):''}${a.roll!=null?' · dobás '+a.roll:''}</span>${tn.phase<3?'<span class="tg wt">közlés előtt</span>':''}</div>${a.why?`<div class="why">${esc(a.why)}</div>`:''}`:'<div style="color:var(--mut)">Még nincs elbírálva.</div>';
  // kör-eredmény diagram

  h+='<div class="sub">Eredmények körönként · oszlop = hatás, vonal = kumulált index</div>';
  if(!done.length)h+='<div style="color:var(--mut)">Még nincs lezárt kör.</div>';
  else{
    const W=340,H=96,pl=22,pr=6,pt=12,pb=16,d=done.map(x=>[2,1,-1][RESL.indexOf(x.adj[t].res)]);
    let c=0;const cum=d.map(v=>c+=v),lo=Math.min(-1,...cum),hi=Math.max(2,...cum);
    const y=v=>pt+(hi-v)/(hi-lo)*(H-pt-pb),bw=Math.min(26,(W-pl-pr)/d.length*.6),x=i=>pl+(i+.5)*(W-pl-pr)/d.length;
    const col=v=>v>=2?'var(--ok)':v>0?'var(--now)':'var(--bad)',lt=v=>v>=2?'S':v>0?'R':'K';
    let g=`<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="${TEAMS[t].nm} eredményei körönként">`;
    g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--ln)"/><text x="${pl-4}" y="${y(0)+3}" text-anchor="end" font-size="9" fill="var(--mut)">0</text><text x="${pl-4}" y="${y(hi)+3}" text-anchor="end" font-size="9" fill="var(--mut)">${hi}</text><text x="${pl-4}" y="${y(lo)+3}" text-anchor="end" font-size="9" fill="var(--mut)">${lo}</text>`;
    d.forEach((v,i)=>{const y0=y(0),y1=y(v);g+=`<rect x="${x(i)-bw/2}" y="${Math.min(y0,y1)}" width="${bw}" height="${Math.max(2,Math.abs(y1-y0))}" rx="2" fill="${col(v)}" opacity=".85"><title>T${done[i].i}: ${done[i].adj[t].res} (${v>0?'+':''}${v})</title></rect><text x="${x(i)}" y="${v>0?y(v)-3:y(v)+10}" text-anchor="middle" font-size="9" font-weight="700" fill="var(--ink)">${lt(v)}</text><text x="${x(i)}" y="${H-3}" text-anchor="middle" font-size="9" fill="var(--mut)">T${done[i].i}</text>`});
    g+=`<polyline fill="none" stroke="var(--ac)" stroke-width="2" points="${cum.map((v,i)=>x(i)+','+y(v)).join(' ')}"/>`+cum.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="var(--ac)"><title>Kumulált: ${v}</title></circle>`).join('');
    h+=g+'</svg>';
    h+=`<div style="color:var(--mut);margin-top:2px">S = siker · R = részleges · K = kudarc &nbsp;|&nbsp; ${ts.res[0]} / ${ts.res[1]} / ${ts.res[2]}</div>`;
  }
  return h;
}

}

function bars(r){const ts=teamState(r);return'KPZ'.split('').map(t=>{const x=ts[t].res,tot=x[0]+x[1]+x[2]||1;return`<div style="display:flex;align-items:center;gap:8px;margin:4px 0">${sym(t,18)}<span style="width:56px;font-size:12px;font-weight:600">${TEAMS[t].nm}</span><div class="sc" style="flex:1"><i style="width:${x[0]/tot*100}%;background:var(--ok)"></i><i style="width:${x[1]/tot*100}%;background:var(--now)"></i><i style="width:${x[2]/tot*100}%;background:var(--bad)"></i></div><span class="mono" style="font-size:11px">${x[0]}/${x[1]}/${x[2]}</span></div>`}).join('')}
function odcrObs(i,r){const ds=r?r.turns.filter(t=>t.phase===3&&t.i>0):[];const d=dataPoints(r);const ts=teamState(r);const tot=['K','P','Z'].reduce((a,t)=>[a[0]+ts[t].res[0],a[1]+ts[t].res[1],a[2]+ts[t].res[2]],[0,0,0]);return`${ds.length} kör, ${d.decisions} indokolt döntés; elbírálások: ${tot[0]} siker, ${tot[1]} részleges, ${tot[2]} kudarc; ${d.observation} megfigyelés.`}
function quickReport(){const c=cfg(),r=execRun(),d=dataPoints(r),hn=S.seats.filter(s=>s.active&&s.mode==='human').length,an=S.seats.filter(s=>s.active&&s.mode==='ai').length;

function renderData(){

  h+='</div><div class="col">';

  const c=cfg();

/* ---------- mobil játékosfelület ---------- */
function phoneHtml(id,full){

function pushLog(n,cat,tx,k){
  const L=S.log,t=lnow(),nn=Math.min(Math.max(n||1,1),18);
  if(k&&(cat==='produktum'||cat==='beállítás'||cat==='ODCR'))for(let i=L.length-1,c=0;i>=0&&c<25;i--,c++){if(L[i].k===k&&t-L[i].ts<90000){L[i].ts=t;L[i].tx=tx;L[i].role=S.role;return}}
  L.push({ts:t,n:nn,ph:STEPS[nn-1].ph,role:S.role,cat,tx,k:k||'',sim:LOGNOW!==null?1:0});
  if(L.length>3000)L.splice(0,L.length-3000);
}

function logDiff(){
  if(S.room!==LOGROOM){LOGROOM=S.room;LOGPREV=logSnap();if(!S.log.length)pushLog(1,'folyamat','Új játék indítva: '+S.title+' ('+(PACKS[S.pack]||PACKS.std).nm+')','');return}
  const cur=logSnap();
  for(const k in cur){const c=cur[k],pv=LOGPREV[k];
    if(pv&&String(pv[3])===String(c[3]))continue;
    if(!pv&&(c[3]===false||c[3]===''||c[3]==null||c[3]==='default'))continue;
    if(c[2]===null)continue;
    pushLog(c[0],c[1],c[2],k);
  }
  LOGPREV=cur;
}

  const c=cfg(),L=S.log,ex=execRun(),dp=dataPoints(ex),pk=PACKS[S.pack]||PACKS.std,ts=teamState(ex);
  const hn=S.seats.filter(s=>s.active&&s.mode==='human').length,an=S.seats.filter(s=>s.active&&s.mode==='ai').length;
  const t0=L.length?L[0].ts:Date.now(),t1=L.length?L[L.length-1].ts:Date.now(),days=Math.round((t1-t0)/864e5);
  const doneN=Object.keys(S.done).filter(n=>S.done[n]).length;
  const rn=m=>runsOf(m).length;
  let o=`# After Action Review (AAR) – ${S.title}\n\n`;
  o+=`- Forgatókönyv: ${pk.nm}\n- Program: Wargame Studio ${VER}\n- Az AAR automatikus vázlat a folyamat-naplóból és a rögzített adatokból; az elemző (ELE) és a Wargame-igazgató (IGA) hagyja jóvá.\n`;
  if(L.some(e=>e.sim))o+=`- **Megjegyzés:** a naplóbejegyzések szimulált teszt eredményei (nem valódi résztvevőktől); az AAR a folyamat és az alkalmazás vizsgálatát szolgálja, nem operatív következtetések levonására.\n`;
  o+=`\n## 1. Összefoglaló\n\n- Probléma: ${getF(1,'problem')||'—'}\n- Cél: ${c.goal}\n- Célkitűzések:\n${c.obj.map((x,i)=>`  ${i+1}. ${x}`).join('\n')||'  —'}\n- Módszertan: ${c.rig}; elbírálás: ${c.adj}; ${c.turns} tervezett kör\n- Időtartam a napló szerint: ${fmtT(t0)} – ${fmtT(t1)} (${days} nap)\n- Lezárt lépések: ${doneN}/18\n- Résztvevők (aktív helyek): ${hn} emberi, ${an} AI\n- Futások: ${rn('playtest')} playtest, ${rn('rehearsal')} főpróba, végrehajtás: ${execTurnsDone()} kör (+ turn 0)\n- Adat: ${dp.decisions} indokolt döntés, ${dp.adjudication} elbírálás, ${dp.time} időmérés, ${dp.observation} megfigyelés\n- Naplóbejegyzések: ${L.length}\n`;
  o+=`\n## 2. Folyamat-idővonal (tervezés → szervezés → végrehajtás → elemzés)\n\n| Lépés | Fázis | Lezárva | Pipák | Produktum | Megbízó | Közreműködő szerepek |\n|---|---|---|---|---|---|---|\n`;
  STEPS.forEach(st=>{const E=L.filter(e=>e.n===st.n),cl=E.filter(e=>e.cat==='kapu'&&/lezárva/.test(e.tx)).slice(-1)[0];
    o+=`| ${String(st.n).padStart(2,'0')} ${st.nm} | ${PH[st.ph]} | ${cl?fmtT(cl.ts):'—'} | ${E.filter(e=>e.cat==='feladat').length}/${st.tasks.length} | ${E.filter(e=>e.cat==='produktum').length} | ${E.some(e=>e.cat==='megbízó')?'igen':(st.tp===1?'hiányzik':st.tp===2?'feltételes':'–')} | ${[...new Set(E.map(e=>e.role))].join(', ')||'—'} |\n`});
  const cat={};L.forEach(e=>cat[e.cat]=(cat[e.cat]||0)+1);
  o+=`\nNaplóbejegyzések típus szerint: ${Object.entries(cat).map(([k,v])=>k+' '+v).join(' · ')}.\n`;
  o+=`\n## 3. Szervezés és előkészítés\n\n`;
  for(const t of 'KPZ'){const a=seatsOf(t).filter(s=>s.active);o+=`- ${TEAMS[t].nm} (${TEAMS[t].sub}): ${a.length} aktív hely, ebből ${a.filter(s=>s.mode==='human').length} emberi (${a.filter(s=>s.mode==='human'&&s.joined).length} csatlakozott), ${a.filter(s=>s.mode==='ai').length} AI\n`}
  const org=L.filter(e=>e.cat==='szervezés').length;o+=`- Szervezési naplóbejegyzés (OOB, csatlakozás, AI-prompt): ${org}\n`;
  o+=`\n## 4. Végrehajtás – játékkörök\n\n`;
  const tdone=ex?ex.turns.filter(t=>t.phase===3):[];
  if(tdone.length){o+=`| Kör | Injekt | KÉK | PIROS | ZÖLD | Idő (perc) |\n|---|---|---|---|---|---|\n`;
    tdone.forEach(tn=>{const cell=t=>{const id=Object.keys(tn.orders).filter(k=>k[0]===t).sort()[0],od=id&&tn.orders[id],a=tn.adj[t];return od?`${trunc(od.act,38)} @ ${od.sec} → **${a?a.res:'—'}**`:'—'};o+=`| T${tn.i} | ${trunc(tn.inject,90)} | ${cell('K')} | ${cell('P')} | ${cell('Z')} | ${tn.t0&&tn.t3?Math.round((tn.t3-tn.t0)/60000):'—'} |\n`});
    o+=`\nEredményindex (siker +2, részleges +1, kudarc −1): `+'KPZ'.split('').map(t=>`${TEAMS[t].nm} ${ts[t].idx>=0?'+':''}${ts[t].idx} (${ts[t].res.join('/')})`).join(' · ')+`\n`}else o+='Nincs lezárt végrehajtási kör.\n';
  o+=`\n## 5. Döntési minták\n\n`;
  const acts=ACT.concat(['Egyéni opció']);const cnt=acts.map(()=>({K:0,P:0,Z:0,s:0,r:0,k:0}));
  tdone.filter(t=>t.i>0).forEach(tn=>Object.entries(tn.orders).forEach(([id,od])=>{const j=ACT.indexOf(od.act),k=j<0?ACT.length:j,t=id[0];if(t==='F')return;cnt[k][t]++;const a=tn.adj[t];if(a)cnt[k][a.res==='Siker'?'s':a.res==='Részleges'?'r':'k']++}));
  o+=`| Válaszopció | KÉK | PIROS | ZÖLD | Összesen | Siker / részleges / kudarc (a csapat körének eredménye) |\n|---|---|---|---|---|---|\n`;
  acts.forEach((a,k)=>{const x=cnt[k],tot=x.K+x.P+x.Z;if(tot)o+=`| ${a} | ${x.K} | ${x.P} | ${x.Z} | ${tot} | ${x.s} / ${x.r} / ${x.k} |\n`});
  o+=`\n## 6. Célkitűzések elérése (ODCR)\n\n`;
  o+=c.obj.length?c.obj.map((x,i)=>{const v=S.odcr[i]||{};return`**${i+1}. ${x}**\n- Observation: ${odcrObs(i,ex)}\n- Discussion: ${v.d||'—'}\n- Conclusion: ${v.c||'—'}\n- Recommendation: ${v.r||'—'}\n`}).join('\n'):'Nincs rögzített célkitűzés.\n';
  o+=`\n## 7. Adatgyűjtés (DCAP) lefedettsége\n\n`;
  o+=S.dcap.length?S.dcap.map(d=>`- ${d.q} → ${METRICS[d.metric]}: ${dp[d.metric]||0} adatpont; teszt: ${d.tested===true?'volt adat':d.tested===false?'hiányzott':'nem jelölt'}`).join('\n')+'\n':'Nincs DCAP-kérdés.\n';
  o+=`\n## 8. Megfigyelések és hot-wash\n\n`+(tdone.map(tn=>tn.obs?`- T${tn.i}: ${tn.obs}`:'').filter(Boolean).join('\n')||'—')+`\n- Hot-wash: ${getF(14,'hotwash')||'—'}\n`;
  const mism=L.filter(e=>e.cat==='feladat'&&/Feladat kész/.test(e.tx)).filter(e=>{const m=e.tx.match(/\[([A-Z]{3})\]/);return m&&m[1]!==e.role&&e.role!=='IGA'}),proxy=L.filter(e=>e.cat==='feladat'&&/Feladat kész/.test(e.tx)&&e.role==='IGA').filter(e=>{const m=e.tx.match(/\[([A-Z]{3})\]/);return m&&m[1]!=='IGA'});
  const reopen=L.filter(e=>e.cat==='kapu'&&/újranyitva/.test(e.tx)).length,defects=L.filter(e=>e.cat==='teszt').length;
  const dur=STEPS.map(st=>{const E=L.filter(e=>e.n===st.n);return{n:st.n,d:E.length?E[E.length-1].ts-E[0].ts:0}}).sort((a,b)=>b.d-a.d)[0];
  o+=`\n## 9. Folyamat- és módszertani megállapítások\n\n- Megbízói pontok: ${L.filter(e=>e.cat==='megbízó'&&/jóváhagyás/.test(e.tx)).length} jóváhagyás a naplóban (szükséges: ${STEPS.filter(s=>s.tp===1).length}${S.cond8?' + feltételes':''}).\n- Újranyitott lépések: ${reopen}.\n- Szerepfegyelem: ${mism.length} feladatot nem a megnevezett szerep pipált ki${mism.length?' ('+mism.slice(0,3).map(e=>e.tx.slice(0,60)).join('; ')+')':''}.\n- A Wargame-igazgató (IGA) nevében kipipált, más szerepre szóló feladat: ${proxy.length}${proxy.length?' (helyettesítés – a szerepek tényleges közreműködését ellenőrizni kell)':''}.\n- Kapu-hibák a tesztben: ${defects}.\n- Leghosszabb lépés a napló szerint: ${dur&&dur.d?String(dur.n).padStart(2,'0')+'. '+STEPS[dur.n-1].nm+' ('+(dur.d>=864e5?Math.round(dur.d/864e5)+' nap':dur.d>=36e5?Math.round(dur.d/36e5)+' óra':Math.round(dur.d/6e4)+' perc')+')':'—'}.\n`;
  const best=[...'KPZ'].sort((a,b)=>ts[b].idx-ts[a].idx),fails=tdone.filter(t=>t.i>0).filter(t=>Object.values(t.adj).some(a=>a.res==='Kudarc')).map(t=>'T'+t.i);
  o+=`\n## 10. Tanulságok és ajánlások (automatikus vázlat – az elemző véglegesíti)\n\n- Erősség: a legjobb eredményindex a ${TEAMS[best[0]].nm} csapatnál (${ts[best[0]].idx>=0?'+':''}${ts[best[0]].idx}).\n- Fejlesztendő: a legalacsonyabb eredményindex a ${TEAMS[best[2]].nm} csapatnál (${ts[best[2]].idx>=0?'+':''}${ts[best[2]].idx}); kudarcot tartalmazó körök: ${fails.join(', ')||'nincs'}.\n- Az indoklások és a megfigyelések alapján vizsgálandó: a koordináció (ENSZ-erő – vendéglátó állam – humanitárius szervezetek), a ROE-értelmezés egységesítése és a nem katonai (41. cikk) eszközök hasznosítása.\n- A követő elemzésben a DCAP minden mérőszámához legyen külön ellenőrzött adatforrás.\n`;
  o+=`\n## 11. Melléklet\n\nA teljes folyamat-napló (${L.length} bejegyzés) CSV és JSON formában letölthető az Adat és elemzés nézetből.\n`;
  return o;
}
function logAndAar(){
  const L=S.log,f=UI.logph||'all',rows=L.filter(e=>f==='all'||String(e.ph)===f),cn=[0,1,2,3].map(p=>L.filter(e=>e.ph===p).length);
  let h='<div style="display:flex;flex-direction:column;gap:12px;margin-top:12px">';
  h+=`<section class="panel hud pad"><h3 style="font-size:20px;margin-bottom:6px">Folyamat-napló · tervezés, szervezés, végrehajtás, elemzés</h3><div class="note" style="margin-bottom:10px">Minden lépés, produktum, szerepfeladat, megbízói jóváhagyás, szereplista-változás, csatlakozás, döntés, elbírálás és ODCR-bejegyzés automatikusan, időbélyeggel és szereppel naplózódik. ${L.some(e=>e.sim)?'A „szim.” jelölésű bejegyzések szimulált teszt eredményei.':''}</div><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px"><label class="ctl">Fázis <select id="logph"><option value="all">Mind (${L.length})</option>${PH.map((x,i)=>`<option value="${i}" ${f===String(i)?'selected':''}>${i+1} · ${x} (${cn[i]})</option>`).join('')}</select></label><button class="btn sm" data-act="dllogcsv" type="button">Napló letöltése (CSV)</button><button class="btn sm" data-act="dllogjson" type="button">Napló letöltése (JSON)</button></div><div class="scr" style="max-height:440px;overflow:auto"><table><thead><tr><th>Idő</th><th>Lépés</th><th>Szerep</th><th>Típus</th><th>Bejegyzés</th></tr></thead><tbody>${rows.slice(-400).reverse().map(e=>`<tr><td class="mono" style="white-space:nowrap">${fmtT(e.ts)}${e.sim?' <span class="tg">szim.</span>':''}</td><td class="mono">${String(e.n).padStart(2,'0')}</td><td class="mono">${esc(e.role)}</td><td>${esc(e.cat)}</td><td>${esc(e.tx)}</td></tr>`).join('')}</tbody></table></div>${rows.length>400?'<div class="note" style="margin-top:6px">Az utolsó 400 bejegyzés látszik; a teljes napló letölthető.</div>':''}</section>`;
  h+=`<section class="panel hud pad"><h3 style="font-size:20px;margin-bottom:6px">AAR · automatikus vázlat a naplóból és az adatokból</h3><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px"><button class="btn sm" data-act="dlaar" type="button">AAR letöltése (.md)</button><button class="btn sm" data-act="aar2field" type="button" ${S.step===16&&!S.done[16]?'':'disabled'} title="A 16. lépésben tölthető a produktum-mezőbe">Betöltés a 16. lépés AAR-mezőjébe</button></div><textarea id="aar" rows="26" readonly class="mono" style="font-size:12px">${esc(buildAAR())}</textarea></section></div>`;
  return h;
}

/* ---------- szimulált teljes folyamat-teszt (békeműveleti forgatókönyv) ---------- */
function runScenarioTest(){
  const rep={defects:[],entries:0},keepRole=PROF?PROF.id:'IGA';
  setPack('pso',false);S=defaults();S.pack='pso';UI.vstep=null;UI.sel=null;LOGROOM=null;
  const D0=Date.UTC(2026,2,2,7,0,0),DAYS=[0,3,7,10,14,28,35,42,56,63,70,77,77,78,85,99,106,113],MIN=60000;
  LOGNOW=D0;logDiff();
  const as=(role,ts,fn)=>{S.role=role;LOGNOW=ts;fn();save()};
  const FR={1:'MEG',2:'IGA',3:'TER',4:'TER',5:'FOR',6:'FEJ',7:'FEJ',8:'REN',9:'IGA',10:'IGA',11:'REN',12:'FAC',14:'FAC',16:'ELE',17:'ELE',18:'IGA'};
  function simTurn(r,T){const tn=newTurn(r);
    as('FOR',T,()=>{tn.inject=(r.mode==='execution'&&tn.i===0)?INJ0:INJ[(tn.i-1+INJ.length)%INJ.length];tn.fric=tn.i%FRIC.length;tn.phase=1;tn.t0=T});
    T+=2*MIN;
    decSeats().forEach(s=>{T+=45000+(s.i%4)*20000;as(s.role,T,()=>{tn.orders[s.id]=psoOrder(s,tn)})});
    T+=3*MIN;as('IGA',T,()=>{tn.phase=2});
    activeTeams(tn).forEach(t=>{T+=2*MIN;as('ADJ',T,()=>{tn.adj[t]=psoAdj(t,tn.i)})});
    T+=2*MIN;as('FAC',T,()=>{tn.obs=psoObs(tn.i)});
    T+=2*MIN;as('IGA',T,()=>{tn.phase=3;tn.t3=T});
    return T+5*MIN}
  function simRun(mode,T,k,role){let r;as(role,T,()=>{r=newRun(mode)});for(let i=0;i<k;i++)T=simTurn(r,T);as('IGA',T,()=>{r.status='closed'});return T+MIN}
  for(let n=1;n<=18;n++){
    const st=STEPS[n-1];let T=D0+DAYS[n-1]*864e5+(n===13?4:2)*36e5;
    S.step=n;
    st.tasks.forEach((tk,i)=>{T+=7*MIN;as(tk[0],T,()=>{S.ticks[n+':'+i]=true})});
    (FIELDS[n]||[]).forEach(f=>{T+=11*MIN;as(FR[n]||'IGA',T,()=>{const k=n+':'+f.id;
      S.fields[k]=f.t==='c'?true:f.t==='n'?(f.id==='turns'?5:f.def):f.t==='s'?(f.id==='method'?f.opts[0]:f.id==='formal'?f.opts[1]:f.id==='rigidity'?RIG[1]:ADJM[2]):(SAMPLE[f.id]||'Minta: '+f.l)})});
    if(n===5){
      as('IGA',T+=10*MIN,()=>{S.seats.forEach(x=>{if(x.t==='K'&&x.i<7)x.active=true;if(x.t==='P'&&x.i<6)x.active=true;if(x.t==='Z'&&x.i<4)x.active=true});seatsOf('K')[3].mode='ai';seatsOf('P')[2].mode='ai'});
      as('FEJ',T+=10*MIN,()=>{const x=seatsOf('K')[2];x.prompt+=' Kiegészítés: a ROE-kártya szerinti erőalkalmazásnál mindig mérlegeld az arányosságot és a civil áldozatok kockázatát.'});
      as('ELE',T+=10*MIN,()=>{loadSampleDcap()})}
    if(n===6){T=simRun('playtest',T+10*MIN,2,'FEJ');T=simRun('playtest',T,2,'FEJ');
      as('ELE',T+=10*MIN,()=>{S.dcap.forEach((d,i)=>d.tested=i<3)})}
    if(n===7)as('ELE',T+=10*MIN,()=>{S.dcap.forEach(d=>d.tested=true)});
    if(n===9)T=simRun('rehearsal',T+10*MIN,2,'IGA');
    if(n===11)S.seats.filter(s=>s.active&&s.mode==='human').forEach(s=>{T+=MIN;as(s.role==='JAT'?'JAT':s.role,T,()=>{s.joined=true})});
    if(n===12){let r;as('IGA',T+10*MIN,()=>{r=newRun('execution')});simTurn(r,T+12*MIN)}
    if(n===13){const r=execRun();T+=10*MIN;for(let i=0;i<5;i++)T=simTurn(r,T);as('IGA',T,()=>{r.status='closed'})}
    if(n===15)as('ELE',T+=10*MIN,()=>{const x=[['A 40. és 42. cikk szerinti eszközök fokozatos alkalmazása ott volt eredményes, ahol a döntés előzetes figyelmeztetéssel és arányosan történt.','A KÉK csapat az ideiglenes intézkedéseket és a POC-t eredményesebben használta, mint az erőalkalmazást; az arányosság indoklása több körben gyenge volt.','A ROE-kártyát döntési támogató eljárásrenddel kell kiegészíteni.'],['A civilek védelmét a koordinációs késedelem és az információhiány akadályozta; a humanitárius hozzáférés a ZÖLD és a KÉK közös döntésein múlt.','A cél részben teljesült: a POC-döntések a körök többségében sikeresek voltak, de a konvoj-feltartás és a menekültáradat ütközött.','Közös POC- és konvoj-koordinációs cella kialakítása az ENSZ-erő, a hatóságok és a szervezetek között.'],['A koordináció a legfőbb szűk keresztmetszet; az információ a ZÖLD felé késve jutott el.','A cél részben teljesült; a koordináció erősíthető, de nem volt egyértelmű közös helyzetkép.','Közös helyzetkép (COP) és rendszeres egyeztetés a követő gyakorlatokon.']];
      cfg().obj.forEach((_,i)=>{S.odcr[i]={d:x[i][0],c:x[i][1],r:x[i][2]}})});
    if(n===16)as('ELE',T+=30*MIN,()=>{S.fields['16:aar']=buildAAR()});
    if(n===17)as('ELE',T+=30*MIN,()=>{S.fields['17:report']=quickReport()});
    if(st.tp===1)as('MEG',T+=15*MIN,()=>{S.sponsor[n]={at:T}});
    const g=gate(n);
    if(!g.ready){const miss=g.items.filter(i=>!i.ok&&!i.soft).map(i=>i.l);rep.defects.push({n,miss});as('IGA',T+=MIN,()=>logNote('teszt','KAPU-HIBA a(z) '+n+'. lépésnél, a lépés mégis lezárva a teszt folytatásához: '+miss.join('; '),n))}
    as('IGA',T+=10*MIN,()=>{S.done[n]=true;if(n<18)S.step=n+1});
  }
  LOGNOW=null;S.role=keepRole;S.step=18;rep.entries=S.log.length;SIMREP=rep;save();return rep;
}
var SIMREP=null;

(function init(){
  const th=lsGet('wgs-theme');if(th)document.documentElement.dataset.theme=th;
  if(PROF)S.role=PROF.id;
  setPack(S.pack||PACK,false);
  let tr=lsGet('wgs-terr')||'default';genTerrain(TERR[tr]?tr:'temp');
  idb('get','sheet').then(b=>{if(b)$('#terr option[value=custom]').disabled=false;else if(tr==='custom'){tr='default';lsSet('wgs-terr','default')}$('#terr').value=tr;setMapSource(tr)});
  $('#gtitle').value=S.title;
  if(IS_PHONE){startPhoneMode();return}
  render();startHostSync();
})();
